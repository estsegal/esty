<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פירוק קמפיינים - שלוש השכבות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gray-bg: #eeeeec;
    --gray-bg-row: #f6f6f4;
    --border: #d3d1cb;
    --border-strong: #201d1a;
    --text: #201d1a;
    --text-muted: #6e6860;
    --text-dim: #9a9389;

    --l1: #285f72;
    --l1-soft: rgba(40,95,114,0.08);
    --l1-border: rgba(40,95,114,0.35);

    --l2: #9d332c;
    --l2-soft: rgba(157,51,44,0.07);
    --l2-border: rgba(157,51,44,0.35);

    --l3: #83611f;
    --l3-soft: rgba(131,97,31,0.08);
    --l3-border: rgba(131,97,31,0.35);
  }

  *{box-sizing:border-box;}
  .ch14-widget{
    font-family:'Assistant', sans-serif;
    direction:rtl;
    color:var(--text);
    max-width:640px;
    margin:28px auto;
    background:var(--gray-bg);
    border-radius:14px;
    padding:22px;
  }

  .ch14-widget .kicker{
    font-size:13px;
    font-weight:700;
    color:var(--text-muted);
    margin:0 0 4px;
  }
  .ch14-widget h2{
    font-size:20px;
    font-weight:800;
    margin:0 0 6px;
  }
  .ch14-widget .sub{
    font-size:14px;
    color:var(--text-muted);
    line-height:1.6;
    margin:0 0 18px;
  }

  .campaign-list{
    display:flex;
    flex-direction:column;
  }

  .campaign-row{
    background:var(--gray-bg-row);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    max-height:1200px;
    opacity:1;
    margin-bottom:8px;
    transition:max-height .35s ease, opacity .25s ease, margin-bottom .35s ease, border-color .3s ease;
  }
  .campaign-row:last-child{margin-bottom:0;}
  .campaign-list.focused .campaign-row:not([data-open="true"]){
    max-height:0;
    opacity:0;
    margin-bottom:0;
    border-color:transparent;
    pointer-events:none;
  }

  .campaign-name-btn{
    width:100%;
    background:none;
    border:none;
    font-family:inherit;
    text-align:right;
    padding:15px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
  }
  .campaign-name-btn .name{
    font-size:16px;
    font-weight:700;
  }
  .campaign-name-btn .meta-inline{
    display:block;
    font-size:12.5px;
    font-weight:400;
    color:var(--text-dim);
    margin-top:2px;
  }
  .chev{
    flex-shrink:0;
    width:18px;height:18px;
    transition:transform .2s ease;
    color:var(--text-muted);
  }
  .campaign-row[data-open="true"] .chev{transform:rotate(180deg);}

  .campaign-detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .campaign-row[data-open="true"] .campaign-detail{max-height:900px;}

  .detail-inner{
    padding:0 18px 18px;
    border-top:1px solid var(--border);
    padding-top:14px;
  }
  .trigger{
    font-size:14px;
    color:var(--text-muted);
    line-height:1.65;
    margin:0 0 16px;
  }

  .steps{
    display:flex;
    gap:8px;
    margin-bottom:2px;
    flex-wrap:wrap;
  }
  .step-btn{
    flex:1;
    min-width:100px;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:8px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    color:var(--text-muted);
    padding:10px 6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .step-num{
    width:17px;height:17px;
    border-radius:50%;
    border:1.5px solid currentColor;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    flex-shrink:0;
  }
  .step-btn[data-layer="1"][data-open="true"]{border-color:var(--l1);color:var(--l1);background:var(--l1-soft);}
  .step-btn[data-layer="2"][data-open="true"]{border-color:var(--l2);color:var(--l2);background:var(--l2-soft);}
  .step-btn[data-layer="3"][data-open="true"]{border-color:var(--l3);color:var(--l3);background:var(--l3-soft);}

  .panel{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .panel.open{max-height:500px;}
  .panel-inner{
    margin-top:10px;
    padding:14px 16px;
    border-radius:8px;
    border:1px solid;
  }
  .panel[data-layer="1"] .panel-inner{background:var(--l1-soft);border-color:var(--l1-border);}
  .panel[data-layer="2"] .panel-inner{background:var(--l2-soft);border-color:var(--l2-border);}
  .panel[data-layer="3"] .panel-inner{background:var(--l3-soft);border-color:var(--l3-border);}

  .panel-label{
    font-size:12px;
    font-weight:700;
    color:var(--text-muted);
    margin:0 0 10px;
  }

  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .tag{
    font-size:12.5px;
    font-weight:700;
    padding:4px 11px;
    border-radius:100px;
    border:1px solid var(--l1);
    color:var(--l1);
    background:#fff;
  }

  .target-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
  .target-list li{
    font-size:14px;
    padding:7px 10px;
    background:#fff;
    border-radius:6px;
    border-inline-start:3px solid var(--l2);
  }
  .target-list b{font-weight:700;}
  .target-list .role{color:var(--text-dim);font-size:12.5px;}

  .panel p.explain{
    font-size:14px;
    line-height:1.7;
    color:var(--text);
    margin:0;
  }
  .spin-flag{
    font-size:13.5px;
    font-weight:700;
    color:var(--l3);
    margin:0 0 6px;
  }

  .more-note{
    text-align:center;
    padding:14px 10px 4px;
    color:var(--text-dim);
    font-size:13px;
  }

  @media (max-width:480px){
    .ch14-widget{padding:16px;border-radius:10px;}
    .steps{flex-direction:column;}
    .step-btn{width:100%;justify-content:flex-start;padding:11px 14px;}
  }
</style>
</head>
<body style="margin:0;background:#fff;">

<div class="ch14-widget">
  <p class="kicker">כלי אינטראקטיבי</p>
  <h2>אנטומיה של קמפיין</h2>
  <p class="sub">מהן 3 השכבות המרכיבות כל קמפיין של ערוץ 14 - לחצו על שם הקמפיין לראות את השכבות המרכיבות אותו</p>

  <div class="campaign-list" id="ch14-list"></div>
</div>

<script>
const CAMPAIGNS = [
  {
    name: "הבגידה מבפנים",
    trigger: "קמפיין שהתמקד בהאשמת גורמים בתוך המערכת הישראלית עצמה ב\"בגידה\"",
    layer1: {
      tags: ["פטריוטיזם", "ביטחון ישראל"],
      explain: "הקמפיין ממוסגר כהגנה על ערכי יסוד — נאמנות למדינה וביטחון הציבור — ובכך זוכה לגיטימציה מיידית שקשה לערער עליה בפומבי."
    },
    layer2: {
      targets: [
        {name:"בכירי מערכת הביטחון", role:"הרמטכ״ל, ראש השב״כ, ראש המוסד ואחרים"},
        {name:"אחים לנשק", role:"תנועת מחאה"},
        {name:"הקפלניסטים", role:"כינוי גנאי למחאת הרפורמה המשפטית"},
        {name:"השמאל", role:"סימון קבוצתי כללי"},
        {name:"יאיר גולן", role:"פוליטיקאי"},
        {name:"שקמה ברסלר", role:"פעילת מחאה"}
      ]
    },
    layer3: {
      flag: "מה זה מסיח מהשיח הציבורי:",
      explain: "אחריות ראש הממשלה לכשל שהוביל לטבח השבעה באוקטובר. במקום דיון ציבורי בשאלת האחריות הישירה, מוסט הדיון לכיוון \"בגידה\" של גורמים אחרים."
    }
  },
  {
    name: "ערעור סמכות בית המשפט העליון ומערכת המשפט",
    trigger: "קמפיין שהתמקד בערעור לגיטימיות בג\"ץ ומערכת המשפט על רקע משפטו של ראש הממשלה",
    layer1: {
      tags: ["דמוקרטיה"],
      explain: "הקמפיין ממוסגר כהגנה על עקרון הדמוקרטיה: שופטים שלא נבחרו על ידי העם קובעים לפוליטיקאים נבחרים מה לעשות, והשופטים הם אלו שבוחרים את מחליפיהם — ולכן, כך נטען, מדובר בפגיעה ברצון העם ובדמוקרטיה עצמה."
    },
    layer2: {
      targets: [
        {name:"בג״ץ", role:"בית המשפט הגבוה לצדק"},
        {name:"שופטי בג״ץ", role:""},
        {name:"יצחק עמית", role:"נשיא בית המשפט העליון"}
      ]
    },
    layer3: {
      flag: "מה זה מסיח מהשיח הציבורי:",
      explain: "השופטים מוצגים כ\"חונטה פושעת\" שמטרתה היחידה להפיל ראש ממשלה מכהן. כך נמנע דיון ציבורי בקריסת קו ההגנה במשפטו, בהופעותיו המביכות באולם בית המשפט, ובשקרים שהתגלו לאורך המשפט."
    }
  },
  {
    name: "היועמ\"שית והפצ\"רית",
    trigger: "קמפיין שהתמקד בתקיפת שתי בעלות תפקידים משפטיים בכירות: היועצת המשפטית לממשלה והפרקליטה הצבאית הראשית",
    layer1: {
      tags: ["דמוקרטיה"],
      explain: "הקמפיין ממוסגר כמאבק נגד \"שלטון פקידים\" — גורמים לא נבחרים שמכתיבים לפוליטיקאים נבחרים ומתערבים בהחלטותיהם. במקרה של הפצ\"רית מתווסף גם מסגור של פגיעה בביטחון המדינה."
    },
    layer2: {
      targets: [
        {name:"היועצת המשפטית לממשלה", role:""},
        {name:"הפרקליטה הצבאית הראשית", role:"הפצ\"רית"}
      ]
    },
    layer3: {
      flag: "מה זה מסיח מהשיח הציבורי:",
      explain: "על שחיתות הממשלה ועל מהלכים שפוגעים בציבור, ועל אחריות דרג המדיניות לכשל השבעה באוקטובר. בקמפיין נגד הפצ\"רית באופן ספציפי — גם על פשעי הסוהרים ומעשי הזוועה במחנה המעצר שדה תימן, ועל הפריצה למחנות הצבאיים שדה תימן ובית ליד, ועל הפוליטיקאים שהובילו אותה."
    }
  },
  {
    name: "נגד עסקאות חטופים",
    trigger: "קמפיין שהתנגד למשא ומתן ולעסקאות להשבת חטופים מרצועת עזה",
    layer1: {
      tags: ["פטריוטיזם", "ביטחון המדינה"],
      explain: "הקמפיין ממוסגר כעמדה עקרונית של \"לא מדברים עם חמאס\" ו\"לא מנהלים משא ומתן עם טרור\" — בטענה שהחזרת מחבלים \"עם דם על הידיים\" תוביל ל\"עוד שבעה באוקטובר\"."
    },
    layer2: {
      targets: [
        {name:"חמאס", role:""},
        {name:"משפחות החטופים", role:""},
        {name:"השמאל", role:"סימון קבוצתי כללי"},
        {name:"הקפלניסטים", role:"כינוי גנאי למחאה נגד ההפיכה המשטרית"},
        {name:"רונן צור", role:"מוביל מחאת משפחות החטופים, עד שהתפטר בשל הצלחת הקמפיין נגדו"}
      ]
    },
    layer3: {
      flag: "מה זה מסיח מהשיח הציבורי:",
      explain: "ההפקרה הגדולה של החטופים, אשמת הממשלה ואחריות ראש הממשלה, ועל החטופים שנרצחו."
    }
  },
  {
    name: "פיטורי הרמטכ\"ל",
    trigger: "קמפיין שהתמקד בהטלת האחריות על הרמטכ\"ל, סביב סוגיית פיטוריו",
    layer1: {
      tags: ["ביטחון המדינה"],
      explain: "הקמפיין ממוסגר כביקורת ביטחונית עניינית: הרמטכ\"ל אינו התקפי מספיק, ואחראי לכך שחמאס, חיזבאללה ואיראן לא מוגרו."
    },
    layer2: {
      targets: [
        {name:"הרצי הלוי", role:"על השבעה באוקטובר"},
        {name:"זמיר", role:"על היעדר \"ניצחון מוחלט\""}
      ]
    },
    layer3: {
      flag: "מה זה מסיח מהשיח הציבורי:",
      explain: "האשמה מוטלת על הרמטכ\"ל \"החלש\", כדי לסלק את הכישלון מראש הממשלה — כך שלא נדבר על כישלון נתניהו בשלוש החזיתות, על ההרוגים, על ההרס, על החורבן ועל השבעה באוקטובר."
    }
  }
];

const listEl = document.getElementById('ch14-list');

function render(){
  listEl.innerHTML = '';

  CAMPAIGNS.forEach((c, ci) => {
    const row = document.createElement('div');
    row.className = 'campaign-row';
    row.dataset.open = 'false';
    row.dataset.idx = ci;

    let detailHtml = '';
    {
      const tagsHtml = c.layer1.tags.map(t => `<span class="tag">${t}</span>`).join('');
      const targetsHtml = c.layer2.targets.map(t =>
        `<li><b>${t.name}</b>${t.role ? ` <span class="role">— ${t.role}</span>` : ''}</li>`
      ).join('');

      detailHtml = `
        <div class="campaign-detail">
          <div class="detail-inner">
            <p class="trigger">${c.trigger}</p>
            <div class="steps">
              <button class="step-btn" data-layer="1" data-open="false" data-idx="${ci}">
                <span class="step-num">1</span> אידיאולוגיה
              </button>
              <button class="step-btn" data-layer="2" data-open="false" data-idx="${ci}">
                <span class="step-num">2</span> האויב
              </button>
              <button class="step-btn" data-layer="3" data-open="false" data-idx="${ci}">
                <span class="step-num">3</span> הספין
              </button>
            </div>
            <div class="panel" data-layer="1" data-idx="${ci}">
              <div class="panel-inner">
                <p class="panel-label">האידיאולוגיה שמצדיקה את מעשיהם</p>
                <div class="tags">${tagsHtml}</div>
                <p class="explain">${c.layer1.explain}</p>
              </div>
            </div>
            <div class="panel" data-layer="2" data-idx="${ci}">
              <div class="panel-inner">
                <p class="panel-label">את מי מסמנים כאויב</p>
                <ul class="target-list">${targetsHtml}</ul>
              </div>
            </div>
            <div class="panel" data-layer="3" data-idx="${ci}">
              <div class="panel-inner">
                <p class="spin-flag">${c.layer3.flag}</p>
                <p class="explain">${c.layer3.explain}</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    row.innerHTML = `
      <button class="campaign-name-btn" data-idx="${ci}">
        <span>
          <span class="name">${c.name}</span>
          <span class="meta-inline">לחצו לפתיחה</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      ${detailHtml}
    `;

    listEl.appendChild(row);
  });
}

render();

listEl.addEventListener('click', (e) => {
  const nameBtn = e.target.closest('.campaign-name-btn');
  if(nameBtn){
    const row = nameBtn.closest('.campaign-row');
    const wasOpen = row.dataset.open === 'true';

    document.querySelectorAll('.campaign-row').forEach(r => {
      if(r !== row){
        r.dataset.open = 'false';
        r.querySelectorAll('.step-btn').forEach(b => b.dataset.open = 'false');
        r.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
      }
    });

    row.dataset.open = (!wasOpen).toString();
    listEl.classList.toggle('focused', !wasOpen);
    return;
  }

  const stepBtn = e.target.closest('.step-btn');
  if(stepBtn){
    const idx = stepBtn.dataset.idx;
    const layer = stepBtn.dataset.layer;
    const panel = listEl.querySelector(`.panel[data-idx="${idx}"][data-layer="${layer}"]`);
    const isOpen = stepBtn.dataset.open === 'true';
    stepBtn.dataset.open = (!isOpen).toString();
    panel.classList.toggle('open', !isOpen);
  }
});
</script>

</body>
</html>
