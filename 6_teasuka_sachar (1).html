<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תעסוקה ושכר לפי מגזר</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{ --txt:#1a1d24; --txt2:#5a6072; --line:#e3e6ec; --blue:#27AAE1; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Assistant',sans-serif; background:#fff; color:var(--txt); padding:24px;}
  .card{max-width:720px; margin:0 auto;}
  .eyebrow{font-size:12px; font-weight:600; color:var(--blue); letter-spacing:.4px; text-transform:uppercase; margin-bottom:6px;}
  h1{font-size:22px; font-weight:700; line-height:1.3; margin-bottom:6px;}
  .sub{font-size:14px; color:var(--txt2); margin-bottom:8px;}
  .toggle{display:flex; gap:8px; margin:16px 0; flex-wrap:wrap;}
  .toggle button{font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:#f5f6f9; color:var(--txt2); cursor:pointer; transition:.15s;}
  .toggle button.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  .chart-wrap{position:relative; height:320px;}
  .src{font-size:11.5px; color:#9aa0ad; margin-top:16px; border-top:1px solid var(--line); padding-top:10px; line-height:1.5;}

  @media (max-width:600px){
    body{padding:16px;}
    h1{font-size:18px;}
    h2{font-size:14.5px;}
    .sub{font-size:13px;}
    .chart-wrap{height:300px;}
    .bignum-row,.headline,.pills{flex-direction:column; gap:10px;}
    .bignum,.hbox,.pill{min-width:0;}
    .bignum .v,.hbox .v{font-size:27px;}
    .toggle button{font-size:12px; padding:6px 11px;}
    .src{font-size:11px;}
  }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">אגף התקציבים, משרד האוצר · למ"ס</div>
  <h1>החרדים עובדים פחות ומשתכרים כחצי מגבר יהודי שאינו חרדי</h1>
  <p class="sub" id="sub">שיעור תעסוקת גברים לפי מגזר, גילאי 25–66 (סוף 2023)</p>

  <div class="toggle">
    <button id="b1" class="active" onclick="setMode('emp')">שיעור תעסוקה</button>
    <button id="b2" onclick="setMode('wage')">שכר חודשי ממוצע</button>
  </div>

  <div class="chart-wrap"><canvas id="c" role="img" aria-label="תעסוקה ושכר לפי מגזר"></canvas></div>

  <p class="src" id="src"></p>
</div>

<script>
const D = {
  emp:{
    labels:['גברים חרדים','גברים יהודים\nלא-חרדים'],
    vals:[55.5, 86.9],
    colors:['#1a1d24','#27AAE1'],
    fmt:v=>v+'%', axis:'%', title:'שיעור תעסוקה (%)',
    sub:'שיעור תעסוקת גברים לפי מגזר, גילאי 25–66 (סוף 2023)',
    src:'מקור: אגף התקציבים, משרד האוצר, עמדה בנושא חוק שירות הביטחון, 24.3.2024, עמ\' 6 (תרשים 1). נתוני למ"ס, מעקב אחר יעדי תעסוקה ממשלתיים.'
  },
  wage:{
    labels:['גבר חרדי','גבר יהודי\nלא-חרדי'],
    vals:[8529, 16024],
    colors:['#1a1d24','#27AAE1'],
    fmt:v=>'₪'+v.toLocaleString(), axis:'₪', title:'שכר חודשי ממוצע (₪)',
    sub:'שכר חודשי ממוצע לגבר לפי מגזר, גילאי 25–64 (2019)',
    src:'מקור: אגף התקציבים, משרד האוצר, עמדה בנושא חוק שירות הביטחון, 24.3.2024, עמ\' 6 (תרשים 2). נתוני למ"ס.'
  }
};
let chart;
function render(mode){
  const d=D[mode];
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('c'),{
    type:'bar',
    data:{ labels:d.labels, datasets:[{ data:d.vals, backgroundColor:d.colors, borderRadius:6, barPercentage:0.55 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:24}},
      plugins:{ legend:{display:false}, tooltip:{rtl:true, callbacks:{label:(c)=>d.fmt(c.raw)}} },
      scales:{
        y:{ display:false, beginAtZero:true, grace:'12%' },
        x:{ grid:{display:false}, ticks:{font:{family:'Assistant',size: window.innerWidth<600?12:14, weight:'600'}} }
      }
    },
    plugins:[{ id:'v', afterDatasetsDraw:(c)=>{ const ctx=c.ctx; c.getDatasetMeta(0).data.forEach((b,i)=>{ ctx.save(); ctx.font='800 18px Assistant'; ctx.fillStyle='#1a1d24'; ctx.textAlign='center'; ctx.fillText(d.fmt(d.vals[i]), b.x, b.y-10); ctx.restore(); }); }}]
  });
  document.getElementById('sub').textContent=d.sub;
  document.getElementById('src').textContent=d.src;
}
function setMode(m){ document.getElementById('b1').classList.toggle('active',m==='emp'); document.getElementById('b2').classList.toggle('active',m==='wage'); render(m); }
render('emp');
</script>
</body>
</html>
