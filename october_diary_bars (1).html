<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --bg:#F7F6F2;
    --panel:#FFFFFF;
    --track:#EFEBE1;
    --border: rgba(20,18,12,.12);
    --border-soft: rgba(20,18,12,.07);
    --ink:#1E1D19;
    --ink-dim:#5B584F;
    --ink-faint:#928E80;
    --redact:#171613;
    --tab-inactive:#EAE7DE;
    --medini:#1976D2;
    --politi:#757575;
    --tadmit:#9E9E9E;
    --bitchoni:#8A9A5B;
    --hatufim:#FFC857;
    --prati:#4A4842;
    --font-head:'Heebo', sans-serif;
    --font-sans:'Assistant', sans-serif;
    --font-mono: ui-monospace, 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  [hidden]{display:none !important;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 10% -10%, rgba(25,118,210,.05), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 110%, rgba(23,22,19,.05), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:680px; margin:0 auto; padding:28px 20px 50px;}

  .masthead{display:flex; align-items:stretch; gap:14px; margin-bottom:20px;}
  .redact-bar{width:7px; flex:none; border-radius:2px;
    background-image: repeating-linear-gradient(180deg, var(--redact) 0 16px, #000 16px 18px, var(--redact) 18px 34px, #2a2822 34px 36px);
  }
  .masthead h1{font-family:var(--font-head); font-weight:800; font-size:clamp(21px,3.3vw,27px); margin:0 0 7px; line-height:1.2;}
  .masthead .sub{margin:0; color:var(--ink-dim); font-size:16px; line-height:1.6;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    padding:8px 8px 20px; box-shadow:0 1px 2px rgba(20,18,12,.04);
  }

  .tabs{display:flex; border-radius:10px; overflow:hidden; margin-bottom:6px;}
  .tab{
    flex:1; text-align:center; padding:15px 10px; cursor:pointer; border:none;
    background:var(--tab-inactive); color:var(--ink-faint);
    font-family:var(--font-head); font-weight:600; font-size:17px;
    transition:background .18s, color .18s;
  }
  .tab.active{background:var(--panel); color:var(--ink);}
  .tab:not(.active):hover{background:#E0DCD0;}

  .total-line{
    text-align:center; font-family:var(--font-sans); font-size:16px; color:var(--ink-dim);
    margin:16px 0 22px;
  }
  .total-line b{font-family:var(--font-head); font-weight:800; color:var(--ink); font-size:22px;}

  .bars{display:flex; flex-direction:column; gap:16px; padding:0 20px;}
  .bar-row{
    cursor:pointer; border:none; background:none; padding:0; text-align:right;
    display:block; width:100%; font-family:inherit; color:inherit;
    border-radius:10px; transition:background .15s;
  }
  .bar-row:hover{background:rgba(20,18,12,.035);}
  .bar-row:hover .bar-row-inner{padding:4px 6px;}
  .bar-row-inner{padding:4px 0; transition:padding .15s;}
  .bar-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;}
  .bar-label{font-family:var(--font-head); font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px;}
  .bar-label .arrow{font-size:13px; color:var(--ink-faint); transition:transform .15s;}
  .bar-row:hover .bar-label .arrow{transform:translateX(-3px);}
  .bar-stat{font-family:var(--font-mono); font-size:16px; color:var(--ink-dim); white-space:nowrap;}
  .bar-stat b{font-family:var(--font-head); font-weight:700; color:var(--ink); font-size:17px;}
  .bar-track{height:26px; background:var(--track); border-radius:7px; overflow:hidden; position:relative;}
  .bar-fill{height:100%; border-radius:7px 0 0 7px; min-width:2px;}
  .bar-fill.full-round{border-radius:7px;}

  .note{margin:22px 16px 0; font-size:14.5px; color:var(--ink-faint); line-height:1.7; border-top:1px solid var(--border-soft); padding-top:15px;}
  .note b{color:var(--ink-dim);}

  /* ---------- Modal ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(20,18,12,.45); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .backdrop.open{opacity:1; pointer-events:auto;}
  .modal{
    position:fixed; z-index:50; background:var(--panel);
    inset:auto 0 0 0; border-radius:18px 18px 0 0; max-height:82vh;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    display:flex; flex-direction:column; pointer-events:none;
    box-shadow:0 -10px 40px rgba(20,18,12,.2);
  }
  .modal.open{transform:translateY(0); pointer-events:auto;}
  @media(min-width:720px){
    .modal{
      inset:50% auto auto 50%; transform:translate(-50%,-46%) scale(.97); opacity:0;
      width:min(640px, 92vw); max-height:80vh; border-radius:16px; transition:transform .22s, opacity .22s;
    }
    .modal.open{transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto;}
  }
  .modal-head{padding:20px 20px 14px; border-bottom:1px solid var(--border-soft); flex:none;}
  .modal-head-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .modal-title{font-family:var(--font-head); font-weight:800; font-size:19px; line-height:1.35;}
  .modal-title .n{color:var(--ink-faint); font-weight:600;}
  .modal-sub{font-family:var(--font-sans); font-size:14px; color:var(--ink-dim); margin-top:5px;}
  .modal-close{
    flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel); color:var(--ink-dim); font-size:15px; cursor:pointer; line-height:1;
  }
  .modal-body{overflow-y:auto; padding:6px 0 14px;}
  table{width:100%; border-collapse:collapse;}
  thead th{
    position:sticky; top:0; background:var(--panel);
    font-family:var(--font-head); font-weight:700; font-size:13px; color:var(--ink-faint);
    text-align:right; padding:10px 20px 8px; border-bottom:1px solid var(--border-soft);
  }
  thead th.col-date, thead th.col-time{text-align:center; width:78px;}
  tbody td{padding:11px 20px; font-size:14.5px; border-bottom:1px solid var(--border-soft); vertical-align:top;}
  tbody td.col-date, tbody td.col-time{text-align:center; font-family:var(--font-mono); font-size:13px; color:var(--ink-dim); white-space:nowrap;}
  tbody tr:last-child td{border-bottom:none;}
  .modal-footnote{
    margin:14px 20px 0; padding:12px 14px; background:var(--track); border-radius:10px;
    font-size:13.5px; color:var(--ink-dim); line-height:1.6;
  }
  .redacted-only{padding:30px 20px; text-align:center; color:var(--ink-dim); font-size:14.5px; line-height:1.7;}

  @media(max-width:480px){
    .app{padding:20px 12px 40px;}
    .masthead h1{font-size:19px;}
    .bars{padding:0 10px;}
  }
</style>

  tadmit:   { label:'תדמית',              desc:'הופעות תקשורת, יועצים, הצהרות',                  color:'#9E9E9E' },
  bitchoni: { label:'ביטחוני-צבאי',        desc:'ישיבות, פגישות, סיורי שטח',                      color:'#8A9A5B' },
  hatufim:  { label:'חטופים',             desc:'מאמץ חטופים, משפחות, שבויים ונעדרים',            color:'#FFC857' },

const ORDER = ['medini','politi','tadmit','bitchoni','hatufim','prati'];

const WEEKDAY = ['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳','שבת'];
function dateLabel(day){ return `${day}.10`; }

// ---------- build bar rows ----------
const barsEl = document.getElementById('bars');
const rowEls = {}, fillEls = {}, statEls = {};

ORDER.forEach(k=>{
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'bar-row';
  row.innerHTML = `
    <div class="bar-row-inner">
      <div class="bar-head">
        <span class="bar-label"><span class="arrow">◂</span>${META[k].label}</span>
        <span class="bar-stat" id="stat-${k}"></span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="fill-${k}" style="background:${META[k].color}"></div></div>
    </div>
  `;
  row.addEventListener('click', ()=> openModal(k));
  barsEl.appendChild(row);
  rowEls[k] = row;
  fillEls[k] = row.querySelector(`#fill-${k}`);
  statEls[k] = row.querySelector(`#stat-${k}`);
});

let current = { ...STATE_A };

function renderBars(target, animate){
  const from = { ...current };
  const toTotal = ORDER.reduce((s,k)=>s+target[k],0);
  const fromTotal = ORDER.reduce((s,k)=>s+from[k],0);
  const duration = animate ? 600 : 0;
  const t0 = performance.now();

  function frame(now){
    const t = duration ? Math.min(1, (now-t0)/duration) : 1;
    const ease = 1 - Math.pow(1-t, 3);
    const totalNow = fromTotal + (toTotal-fromTotal)*ease;
    ORDER.forEach(k=>{
      const v = from[k] + (target[k]-from[k])*ease;
      const pct = totalNow>0 ? (v/totalNow*100) : 0;
      fillEls[k].style.width = pct + '%';
      fillEls[k].classList.toggle('full-round', pct < 3);
      rowEls[k].style.display = (target[k] === 0 && v < 0.5) ? 'none' : '';
      const showVal = Math.round(v);
      statEls[k].innerHTML = `<b>${showVal}</b> · ${pct.toFixed(1)}%`;
    });
    document.getElementById('totalNum').textContent = Math.round(totalNow);
    if (t < 1) requestAnimationFrame(frame);
    else current = { ...target };
  }
  requestAnimationFrame(frame);
}

  document.getElementById('tabA').classList.toggle('active', id==='tabA');

}

// ---------- modal ----------
const backdrop = document.getElementById('backdrop');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

function openModal(key){
  const meta = META[key];
  const isTabB = document.getElementById('tabB').classList.contains('active');

  if (key === 'prati'){
    modalTitle.innerHTML = `${meta.label} <span class="n">— 21 רשומות</span>`;
    modalSub.textContent = 'רשומות שהוחשכו ביומן וסומנו "פרטי"';
    modalBody.innerHTML = `<div class="redacted-only">
      תוכן 21 הרשומות המסומנות "פרטי" הוחשך במלואו ביומן המקורי — אין נתון זמין על מהותן.
      הסימון "פרטי" (בשונה מ"ב.מ") סביר שמציין עניינים אישיים שגרתיים, ולא בהכרח תוכן רגיש.
    </div>`;
    show();
    return;
  }

  const events = EVENTS[key];
  const n = events.length;
  modalTitle.innerHTML = `${meta.label} <span class="n">— ${n} אירועים</span>`;
  modalSub.textContent = meta.desc;

  let rows = events.map(e => `
    <tr>
      <td class="col-date">${dateLabel(e.day)}</td>
      <td class="col-time">${e.t}</td>
      <td>${e.x}</td>
    </tr>
  `).join('');

  let footnote = '';
  if (key === 'bitchoni' && isTabB){
    footnote = `<div class="modal-footnote"><b>בנוסף:</b> 13 רשומות נוספות מוחשכות בסימון "ב.מ" (ביטחון מידע) — ככל הנראה תוכן ביטחוני-מבצעי נוסף שאין עליו פרטים זמינים.</div>`;
  }

  modalBody.innerHTML = `
    <table>
      <thead><tr>
        <th class="col-date">תאריך</th>
        <th class="col-time">שעה</th>
        <th>פירוט</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${footnote}
  `;
  show();
}

function show(){
  backdrop.classList.add('open');
  modal.classList.add('open');
}
function closeModal(){
  backdrop.classList.remove('open');
  modal.classList.remove('open');
}
backdrop.addEventListener('click', closeModal);
modalClose.addEventListener('click', closeModal);
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });
</script>
