function closeCard(){
  document.getElementById('detailCard').style.display = 'none';
  document.getElementById('backdrop').style.display = 'none';
  openCat = null;
}

function selectCat(key){
  if(openCat === key){
    closeCard();
    return;
  }
  openCat = key;
  const c = CAT[key];
  const first = c.people.length ? c.people[0][0] : null;
  render(key, first);
}
function selectSpeaker(catKey, name){
  render(catKey, name);
}
function render(catKey, speakerName){
  document.getElementById('detailCard').style.display = 'block';
  document.getElementById('backdrop').style.display = 'block';
  const c = CAT[catKey];
  const q = speakerName ? SQ[speakerName] : null;
  const chips = c.people.map(([n,cnt])=>{
    const active = n===speakerName;
    return '<span onclick="event.stopPropagation();selectSpeaker(\''+catKey+'\',\''+n+'\')" style="cursor:pointer;font-size:14px;font-weight:600;padding:5px 12px;border-radius:10px;background:'+(active?c.color+'40':'var(--surface-1)')+';color:var(--text-primary);border:1.5px solid '+c.color+'">'+n+' ('+cnt+')</span>';
  }).join('');
  let quoteHtml;
  if(!speakerName || !q){
    quoteHtml = '<div style="font-size:14px;color:var(--text-muted)">אין ציטוט לדוגמה זמין עבור הבחירה הזו</div>';
  } else {
    quoteHtml = '<p style="font-family:var(--font-voice);font-size:16px;line-height:1.6;margin:0;border-right:3px solid '+c.color+';padding-right:12px">'+q.t+
     '<span style="display:block;font-family:\'Assistant\',sans-serif;font-size:14px;font-weight:600;color:var(--text-muted);margin-top:6px">'+speakerName+', '+q.d+'</span></p>';
  }
  document.getElementById('detailCard').innerHTML =
   '<div onclick="event.stopPropagation()">'+
   '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">'+
   '<div style="font-size:20px;font-weight:700">'+c.label+'</div>'+
   '<span onclick="closeCard()" style="cursor:pointer;font-size:20px;color:var(--text-muted);line-height:1">\u2715</span>'+
   '</div>'+
   '<div style="font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:16px">'+c.subtitle+'</div>'+
   (c.people.length ? '<div style="font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:8px">משתתפים בולטים — לחצי לציטוט</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px">'+chips+'</div>' : '') +
   '<div style="font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:8px">אופן ההשפעה</div>'+
   '<p style="font-size:16px;font-weight:600;line-height:1.6;margin:0 0 18px">'+c.text+'</p>'+
   quoteHtml+
   '</div>';
}
</script>

</body>
</html>
